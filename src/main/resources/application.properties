# Server Configuration
server.port=9090
server.servlet.context-path=/

# Application Name
spring.application.name=Spring Boot Application

# Logging Configuration
logging.level.root=INFO
logging.level.com.example=DEBUG
logging.level.com.example.service=DEBUG
logging.level.com.example.repository=DEBUG
logging.pattern.console=%d{yyyy-MM-dd HH:mm:ss} - %msg%n

# H2 Database Configuration
spring.datasource.url=jdbc:h2:mem:testdb
spring.datasource.driverClassName=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

# JPA/Hibernate Configuration
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.enable_lazy_load_no_trans=true

# Transaction Configuration
spring.jpa.properties.hibernate.jdbc.batch_size=20
spring.jpa.properties.hibernate.order_inserts=true
spring.jpa.properties.hibernate.order_updates=true

# H2 Console Configuration
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

# Actuator Configuration
management.endpoints.web.exposure.include=health,info,metrics
management.endpoint.health.show-details=always

# External API Configuration
# Use separate components to avoid hardcoded port mismatch
external.api.protocol=http
external.api.host=localhost
external.api.port=${server.port}
external.api.path=/api/external
external.api.url=${external.api.protocol}://${external.api.host}:${external.api.port}${external.api.path}

# Mock API Country Mappings Configuration
# Format: mock.api.countries.<ID>=<lang>|<country>
mock.api.countries.1=en|US
mock.api.countries.2=sv|SE
mock.api.countries.3=lv|LV
mock.api.countries.4=pt|BR
mock.api.countries.5=en|GB
mock.api.countries.6=de|DE
mock.api.countries.7=pl|PL
mock.api.countries.8=fr|FR
mock.api.countries.9=it|IT
mock.api.countries.10=es|ES
